name: C Core

on:
  push:
    branches: [main, migration, refactor]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install BLAS/LAPACK dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev liblapacke-dev
      - uses: mamba-org/setup-micromamba@v2
        if: runner.os == 'Windows'
        with:
          environment-name: numelyx
          create-args: >-
            -c conda-forge
            mkl-devel
      - name: Configure (Ubuntu)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DNUMELYX_BUILD_TESTS=ON
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: bash -el {0}
        run: cmake -S . -B build -DNUMELYX_BUILD_TESTS=ON -DCMAKE_PREFIX_PATH="$CONDA_PREFIX/Library"
      - name: Build
        shell: bash -el {0}
        run: cmake --build build --config Debug --parallel 2
      - name: Test
        shell: bash -el {0}
        run: ctest --test-dir build -C Debug --output-on-failure

  thread-sanitizer:
    name: ThreadSanitizer (Ubuntu / GCC)
    runs-on: ubuntu-latest
    env:
      CC: gcc
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@v4
      - name: Install BLAS/LAPACK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev liblapacke-dev
      - name: Configure with ThreadSanitizer
        run: cmake -S . -B build-tsan -DNUMELYX_BUILD_TESTS=ON -DNUMELYX_ENABLE_TSAN=ON
      - name: Build instrumented tests
        run: cmake --build build-tsan --config Debug --parallel 2
      - name: Run instrumented tests
        run: ctest --test-dir build-tsan -C Debug --output-on-failure

  address-undefined-sanitizers:
    name: AddressSanitizer + UBSan (Ubuntu / GCC)
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Install BLAS/LAPACK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev liblapacke-dev
      - name: Configure with AddressSanitizer and UBSan
        run: cmake -S . -B build-asan-ubsan -DNUMELYX_BUILD_TESTS=ON -DNUMELYX_ENABLE_ASAN_UBSAN=ON
      - name: Build instrumented tests
        run: cmake --build build-asan-ubsan --config Debug --parallel 2
      - name: Run instrumented tests
        run: ctest --test-dir build-asan-ubsan -C Debug --output-on-failure
